<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#38bdf8" />
  <title>Monde de blocs</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="blocs.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="touch"></div>
  <div id="flash"></div>
  <div id="loading">🧱 Chargement du monde...</div>

  <!-- Commandes de jeu (mode promenade / parcours / petit monde) -->
  <div id="stick"><div id="stickKnob"></div></div>
  <button id="jumpBtn" aria-label="Sauter">⬆️<span>Saute</span></button>

  <!-- Boutons rapides pour construire tout en se promenant -->
  <div id="walkBuildBtns">
    <button id="walkPlaceBtn" title="Poser un bloc devant moi">🧱<span>Poser</span></button>
    <button id="walkBreakBtn" title="Enlever le bloc devant moi">⛏️<span>Casser</span></button>
    <button id="walkRespawnBtn" title="Revenir à l'entrée">🚪<span>Entrée</span></button>
  </div>

  <!-- Contrôles rapides de caméra en mode construction -->
  <div id="camControls">
    <button id="camLeftBtn" title="Tourner à gauche">↺</button>
    <button id="camCenterBtn" title="Recentrer la vue">🎯</button>
    <button id="camRightBtn" title="Tourner à droite">↻</button>
  </div>

  <div id="hud">
    <div class="hud-left">
      <button id="homeBtn" class="round" aria-label="Menu">🏠</button>
      <div id="hudText"></div>
    </div>
    <div class="hud-right">
      <button id="mondeBuildBtn" class="round monde-only" title="Construire sur l'île">🔨</button>
      <button id="mondeWeatherBtn" class="round monde-only" title="Changer la météo (Soleil / Neige / Nuit)">☀️</button>
      <button id="mondeFeedBtn" class="round monde-only" title="Donner à manger aux animaux">🍎</button>
      <button id="mondeRideBtn" class="round monde-only" title="Monter sur un animal">🦖</button>
      <button id="mondeHintBtn" class="round monde-only" title="Voir où est un trésor">🧭</button>
      <button id="mondeHomeBtn" class="round monde-only" title="Revenir à la maison">🏡</button>
      <button id="buildSlotBtn" class="round build-only" title="Mes 3 Mondes">💾</button>
      <button id="buildDayNightBtn" class="round build-or-walk" title="Jour / Nuit">☀️</button>
      <button id="buildPhotoBtn" class="round build-or-walk" title="Prendre une photo pour Mon Album">📸</button>
      <button id="soundBtn" class="round" aria-label="Son">🔊</button>
    </div>
  </div>

  <!-- Barre de construction rapide dans Petit monde -->
  <div id="mondeBuildBar">
    <div class="mb-tools">
      <button data-mtool="place" class="active">✨<span>Poser</span></button>
      <button data-mtool="remove">⛏️<span>Enlever</span></button>
      <button id="mondeUndoBtn">↩️<span>Oups</span></button>
      <button id="mondeResetBtn">🧹<span>Rétablir</span></button>
    </div>
    <div class="mb-sep"></div>
    <div id="mondeItems" class="mb-items"></div>
  </div>

  <!-- Barre de construction -->
  <div id="buildBar">
    <div class="bb-tools">
      <button data-tool="place" class="active">🧱<span>Poser</span></button>
      <button data-tool="remove">⛏️<span>Enlever</span></button>
      <button data-tool="paint">🖌️<span>Peindre</span></button>
      <button data-tool="pick">💧<span>Copier</span></button>
      <button id="buildModeBtn">👆<span>1 bloc</span></button>
      <button id="buildMirrorBtn">🪞<span>Miroir</span></button>
      <button id="buildUndo">↩️<span>Oups</span></button>
      <button id="buildModels">📐<span>Modèles</span></button>
      <button id="buildClear">🧹<span>Effacer</span></button>
      <button id="buildWalk" class="walk">🚶<span>Me promener</span></button>
    </div>
    <div id="buildPalette"></div>
  </div>

  <!-- Menu principal -->
  <section id="menu" class="screen">
    <div class="panel">
      <a class="back-atelier" href="../index.html">⬅ Atelier Magique</a>
      <h1>🧱 Monde de blocs</h1>
      <div class="star-total"></div>
      <button class="big-card c1" id="playParcours"><span class="bc-emoji">🏃</span><span class="bc-title">Parcours</span><span class="bc-sub">Saute jusqu’au drapeau !</span></button>
      <button class="big-card c2" id="playMonde"><span class="bc-emoji">🏝️</span><span class="bc-title">Petit monde</span><span class="bc-sub">Grande île, trésors et animaux</span></button>
      <button class="big-card c3" id="playBuild"><span class="bc-emoji">🏗️</span><span class="bc-title">Construction</span><span class="bc-sub">Construis ton monde 3D</span></button>
      <button class="perso-btn" id="openPerso">👕 Mon perso</button>
    </div>
  </section>

  <!-- Choix du niveau -->
  <section id="levels" class="screen">
    <div class="panel">
      <button class="back-menu">⬅ Retour</button>
      <h2>🏃 Choisis ton niveau</h2>
      <div id="levelList"></div>
    </div>
  </section>

  <!-- Mon perso -->
  <section id="perso" class="screen">
    <div class="panel">
      <button class="back-menu">⬅ Retour</button>
      <h2>👕 Mon perso <span class="star-total small"></span></h2>
      <div class="p-label">T-shirt</div><div class="swatches" id="shirtColors"></div>
      <div class="p-label">Pantalon</div><div class="swatches" id="pantsColors"></div>
      <div class="p-label">Peau</div><div class="swatches" id="skinColors"></div>
      <div class="p-label">Cheveux</div><div class="swatches" id="hairColors"></div>
      <div class="p-label">Chapeau</div><div class="hats" id="hatList"></div>
      <p class="p-hint">Gagne des étoiles ⭐ (pièces, gemmes, coffres, niveaux) pour ouvrir les chapeaux.</p>
    </div>
  </section>

  <!-- Choix de modèles de construction -->
  <div id="modelsModal" class="modal">
    <div class="modal-card">
      <div class="q-title">📐 Choisis un modèle à décorer !</div>
      <div class="models-grid" id="modelsGrid"></div>
      <div class="c-buttons"><button id="modelsClose">Fermer</button></div>
    </div>
  </div>

  <!-- Choix des 3 emplacements de sauvegarde -->
  <div id="slotsModal" class="modal">
    <div class="modal-card">
      <div class="q-title">💾 Mes 3 Mondes</div>
      <div class="slots-list" id="slotsList"></div>
      <div class="c-buttons"><button id="slotsClose">Fermer</button></div>
    </div>
  </div>

  <!-- Question (porte, coffre) -->
  <div id="question" class="modal">
    <div class="modal-card">
      <div class="q-title"></div>
      <div class="q-calc"></div>
      <div class="q-answers"></div>
    </div>
  </div>

  <!-- Fête -->
  <div id="celebrate" class="modal">
    <div class="modal-card">
      <div class="c-stars"></div>
      <div class="c-title"></div>
      <div class="c-text"></div>
      <div class="c-buttons"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="jeu.js"></script>
</body>
</html>
